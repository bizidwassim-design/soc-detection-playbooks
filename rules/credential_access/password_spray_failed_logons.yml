title: Failed Logon Event (Password Spray Base Rule)
id: 4f7c2a19-8e5d-4b63-a1f2-6d9c3e8b5a71
name: failed_logon_event
status: stable
description: |
  Base rule matching a single failed authentication on Windows (NTLM/Kerberos). On its own it is
  far too noisy to alert on; it exists to feed the correlation rule below, which turns it into a
  password-spray detection.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Wassim Bizid
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4625
      - 4771
  filter_noise:
    TargetUserName|endswith: '$'   # computer accounts
  condition: selection and not filter_noise
falsepositives:
  - Any mistyped password — do not alert on this rule directly
level: informational
---
title: Password Spraying - Many Accounts Failing From One Source
id: e9a1f4c3-6b27-4d85-9f30-1c8e5a2b7d46
status: stable
description: |
  Detects a single source IP failing authentication against many distinct accounts in a short
  window — the signature of a password-spray attack, which tries one common password against
  every user to avoid lockouts. Tune the threshold (25 accounts / 10 minutes) to your environment.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Wassim Bizid
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - failed_logon_event
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    gte: 25
    field: TargetUserName
falsepositives:
  - Misconfigured service or scanner using an outdated credential against many hosts
  - Shared NAT/VPN egress addresses with many users mistyping after a password-policy change
level: high
