title: Scheduled Task Created to Run a Binary From a Temporary Path
id: 9c4f1a7e-2d68-4b53-8e0a-5a7c3b9d1f62
status: stable
description: |
  Detects creation of a scheduled task whose action runs an executable or script from a
  user-writable or temporary location. A common persistence technique after initial access.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: soc-detection-playbooks contributors
date: 2026-10-31
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_path:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Downloads\'
  condition: selection and selection_path
falsepositives:
  - Software installers and updaters that create tasks from %APPDATA% or %ProgramData% (allow-list by product)
level: medium
