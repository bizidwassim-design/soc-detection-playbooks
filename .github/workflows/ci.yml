name: Sigma check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install sigma-cli pyyaml
      - name: Validate every rule with the official Sigma CLI
        run: sigma check rules/
      - name: Convert every rule (including correlations) with the Splunk backend
        run: |
          sigma plugin install splunk
          sigma convert -t splunk --without-pipeline rules/
      - name: Navigator layer must match the rule tags
        run: |
          python scripts/attack_layer.py
          git diff --exit-code -- docs/attack-layer.json
