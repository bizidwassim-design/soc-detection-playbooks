name: Sigma check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sigma-cli pyyaml
      - name: Validate every rule with the official Sigma CLI
        run: sigma check rules/
      - name: Convert a sample to a backend to prove the rules are consumable
        run: |
          sigma plugin install splunk
          sigma convert -t splunk -p sysmon rules/ransomware/shadow_copy_deletion.yml
          sigma convert -t splunk rules/credential_access/password_spray_failed_logons.yml
      - name: Navigator layer must match the rule tags
        run: |
          python scripts/attack_layer.py
          git diff --exit-code -- docs/attack-layer.json
